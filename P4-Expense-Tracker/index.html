<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
    rel="stylesheet" />
</head>

<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance-container">
      <h2>Your Balance</h2>
      <h1 id="balance">$0.00</h1>

      <div class="summary">
        <div class="income">
          <h3>Income</h3>
          <p id="income-amount">$0.00</p>
        </div>
        <div class="expenses">
          <h3>Expenses</h3>
          <p id="expense-amount">$0.00</p>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="transaction-container">
        <h2>Transactions</h2>
        <ul id="transaction-list">
          <!-- TRANSACTIONS WILL BE INSERTED HERE -->
          <li class="transaction income">Item 1</li>
          <li class="transaction expenses">Item 2</li>
          <li class="transaction">Item 3</li>
          <li class="transaction">Item 1</li>
          <li class="transaction">Item 2</li>
          <li class="transaction">Item 3</li>
          <li class="transaction">Item 1</li>
          <li class="transaction">Item 2</li>
          <li class="transaction">Item 3</li>
        </ul>
      </div>

      <div class="form-container">
        <h2>Add Transaction</h2>

        <form id="transaction-form">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Enter description..." required />
          </div>

          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount..." required />
            <!-- sử dụng để ghi chú -->
            <small>Use negative (-) for expenses</small>
          </div>
          <!-- submit form -->
          <button type="submit">Add Transaction</button>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>

<!-- 
Bạn nên dùng <form> khi:
Có dữ liệu cần người dùng nhập vào và gửi đi
  Ví dụ: đăng nhập, đăng ký, thêm transaction, comment box, checkout,…
  Dữ liệu có thể gửi tới server (backend) hoặc xử lý bằng JavaScript.
Cần hỗ trợ tính năng mặc định của trình duyệt cho form
  Submit bằng phím Enter.
  Dùng thuộc tính required, minlength, maxlength, pattern để validate input.
  Tự động focus field đầu tiên khi mở modal.
SEO và accessibility (truy cập cho người khuyết tật)
  Screen reader (người khiếm thị) sẽ hiểu đây là vùng form nhập liệu.
  Giúp máy tìm kiếm hiểu trang web có chứa form (login, search,…). 
-->
