<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men's Clothes | Shop for Men's</title>
  <link rel="stylesheet" href="my-page.css">
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      <img src="./assets/logo.svg" alt="ASOS Logo">
    </div>

    <nav class="nav-links">
      <a href="#">WOMEN</a>
      <a href="#">MEN</a>
    </nav>

    <div class="search-bar">
      <input type="text" placeholder="Search for items and brands">
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="icon-buttons">
      <!-- Bọc icon user và dropdown menu -->
      <div class="user-dropdown">
        <button title="Account"><i class="fa-solid fa-user"></i></button>
        <!-- Menu xổ xuống -->
        <div class="dropdown-menu">
          <div class="dropdown-header">
            <a href="#">Sign In</a> | <a href="#">Join</a>
          </div>
          <hr>
          <a href="#"><i class="logo-dropdown fa-solid fa-user"></i> My Account</a>
          <a href="#"><i class="logo-dropdown fa-solid fa-bag-shopping"></i> My Orders</a>
          <a href="#"><i class="logo-dropdown fa-solid fa-rotate-left"></i> Returns Information</a>
          <a href="#"><i class="logo-dropdown fa-regular fa-comment-dots"></i> Contact Preferences</a>
        </div>
      </div>
      <button title="Wishlist"><i class="fa-regular fa-heart"></i></button>
      <button title="Bag"><i class="fa-solid fa-bag-shopping"></i></button>
    </div>

  </header>

  <div class="promo-bar">
    <div class="promo-text">
      🔥 Giảm giá 50% toàn bộ áo thun hôm nay! Mua ngay! 🔥 Miễn phí vận chuyển cho đơn trên 500k!
    </div>
  </div>

</body>

</html>
